name: Nix

on:
  push:
    branches: [main]
    paths: [go.mod, go.sum]
  workflow_dispatch:

permissions: { contents: write, pull-requests: write }
concurrency: nix-${{ github.ref }}

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if nix build .#justray.goModules --no-link 2>nix.log; then exit 0; fi
          cat nix.log
          hash=$(awk '/got:[[:space:]]+sha256-/ { print $2; exit }' nix.log)
          test -n "$hash"
          sed -i -E "s|(vendorHash \? \")sha256-[^\"]+(\")|\1$hash\2|" flake.nix
          nix build .#justray.goModules --no-link
          git checkout -B workflows/nix
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -am "chore(nix): update hash"
          git push -f origin workflows/nix
          pr=$(gh pr list --head workflows/nix --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head workflows/nix --title "chore(nix): update hash" --body ""
          fi
          gh pr merge --auto --squash workflows/nix
