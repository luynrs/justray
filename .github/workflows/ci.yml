name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -tags=with_quic,with_utls,with_gvisor,with_grpc,with_xhttp,with_awg,badlinkname
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify
        run: |
          go vet ./...
          go test ./...
      - uses: golangci/golangci-lint-action@v9
        if: runner.os == 'Linux'
        with:
          version: v2.14.0
          args: --build-tags with_quic,with_utls,with_gvisor,with_grpc,with_xhttp,with_awg,badlinkname
      - name: Build
        run: go build ./...
      - name: Build macOS
        if: runner.os == 'Linux'
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: GOFLAGS="$GOFLAGS -race" GORACE=atexit_sleep_ms=0 go test ./...
      - name: GoReleaser
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v7
        with:
          args: check
