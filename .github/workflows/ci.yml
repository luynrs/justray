name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GOFLAGS: -tags=with_quic,with_utls,with_gvisor,with_grpc,with_xhttp,with_awg,badlinkname

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: |
          [ "$RUNNER_OS" = Linux ] && export GOFLAGS="$GOFLAGS -race" GORACE=atexit_sleep_ms=0
          go test -count=1 -vet=all ./...

      - run: go build ./cmd/...

      - if: runner.os == 'Linux'
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./cmd/...
