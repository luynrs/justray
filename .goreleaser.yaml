version: 2
project_name: justray

builds:
  - &common_build
    id: justray
    main: ./cmd/justray
    binary: justray
    env: [CGO_ENABLED=0]
    flags: ["-tags=with_quic,with_utls,with_gvisor,with_grpc,with_xhttp,with_awg,badlinkname"]
    ldflags: ["-s -w -X github.com/luynrs/justray/internal/version.Version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - <<: *common_build
    id: justrayd
    main: ./cmd/justrayd
    binary: justrayd
    ldflags: ['-s -w {{ if eq .Os "windows" }}-H windowsgui {{ end }}-X github.com/luynrs/justray/internal/version.Version={{ .Version }}']

archives:
  - ids: [justray, justrayd]
    name_template: 'justray-{{ .Version }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

nfpms:
  - ids: [justray, justrayd]
    formats: [deb, rpm]
    file_name_template: "justray-{{ .Version }}-{{ .Arch }}"
    homepage: &url https://github.com/luynrs/justray
    maintainer: luynrs <157303229+luynrs@users.noreply.github.com>
    description: &desc A modern VPN client that lives in your terminal
    license: &lic GPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/justray/LICENSE
        file_info: { mode: 0644 }
      - src: /usr/bin/justray
        dst: /usr/bin/jray
        type: symlink
    overrides:
      deb:
        dependencies: [libcap2-bin]
      rpm:
        dependencies: [libcap]

changelog:
  sort: asc
  abbrev: 7
  format: "`{{ .SHA }}` {{ .Message }}"
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: "⚡ Performance"
      regexp: '^.*?perf(\([[:word:]-]+\))??!?:.+$'
      order: 2
    - title: "♻️ Refactoring"
      regexp: '^.*?refactor(\([[:word:]-]+\))??!?:.+$'
      order: 3
  filters:
    exclude:
      - '^.*?(docs|chore|ci)(\([[:word:]-]+\))??!?:'
      - '^.*?Merge (pull request|branch)'

homebrew_casks:
  - name: justray
    binaries: [justray, justrayd]
    repository:
      owner: luynrs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TOKEN }}"
    homepage: *url
    description: *desc
    license: *lic
    skip_upload: auto
    custom_block: 'binary "justray", target: "jray"'
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/justray", "{{ .StagedPath }}/justrayd"]
          end

winget:
  - name: justray
    publisher: luynrs
    package_identifier: luynrs.justray
    package_name: JustRay
    short_description: *desc
    homepage: *url
    license: *lic
    tags: [cli, vpn, terminal]
    skip_upload: auto
    repository:
      owner: luynrs
      name: winget-pkgs
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

aurs:
  - name: justray-bin
    homepage: *url
    description: *desc
    license: *lic
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/justray-bin.git
    url_template: https://github.com/luynrs/justray/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    skip_upload: auto
    provides: [justray]
    conflicts: [justray]
    package: |
      install -Dm755 "./justray" "${pkgdir}/usr/bin/justray"
      install -Dm755 "./justrayd" "${pkgdir}/usr/bin/justrayd"
      ln -s justray "${pkgdir}/usr/bin/jray"

release:
  name_template: "{{ .Version }}"
  prerelease: auto
  mode: replace
