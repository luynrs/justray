version: 2
project_name: justray

builds:
  - id: justray
    main: ./cmd/justray
    binary: justray
    env: [CGO_ENABLED=0]
    flags: ["-tags=with_quic,with_utls,with_gvisor,with_grpc,with_xhttp"]
    ldflags: ["-s -w -X github.com/luynrs/justray/internal/shared/version.Version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: justrayd
    main: ./cmd/justrayd
    binary: justrayd
    env: [CGO_ENABLED=0]
    flags: ["-tags=with_quic,with_utls,with_gvisor,with_grpc,with_xhttp"]
    ldflags: ['-s -w {{ if eq .Os "windows" }}-H windowsgui {{ end }}-X github.com/luynrs/justray/internal/shared/version.Version={{.Version}}']
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - ids: [justray, justrayd]
    name_template: "justray_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: justray
    binaries: [justray, justrayd]
    repository:
      owner: luynrs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TOKEN }}"
    homepage: https://github.com/luynrs/justray
    description: A modern VPN client that lives in your terminal
    license: GPL-3.0-only
    skip_upload: "{{ .IsSnapshot }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/justray", "#{staged_path}/justrayd"]
          end
          FileUtils.ln_sf "#{HOMEBREW_PREFIX}/bin/justray", "#{HOMEBREW_PREFIX}/bin/jray"
        uninstall: |
          FileUtils.rm_f "#{HOMEBREW_PREFIX}/bin/jray"

winget:
  - name: justray
    publisher: luynrs
    package_identifier: luynrs.justray
    package_name: JustRay
    short_description: A modern VPN client that lives in your terminal
    description: A terminal VPN client with support for subscriptions and multiple protocols.
    homepage: https://github.com/luynrs/justray
    publisher_url: https://github.com/luynrs
    publisher_support_url: https://github.com/luynrs/justray/issues
    license: GPL-3.0-only
    license_url: https://www.gnu.org/licenses/gpl-3.0.html
    tags: [cli, vpn, terminal]
    path: manifests/l/luynrs/justray/{{ .Version }}
    skip_upload: "{{ .IsSnapshot }}"
    repository:
      owner: luynrs
      name: winget-pkgs
      token: "{{ .Env.WINGET_TOKEN }}"
      branch: justray-{{ .Version }}

aurs:
  - name: justray-bin
    homepage: https://github.com/luynrs/justray
    description: A modern VPN client that lives in your terminal
    license: GPL-3.0-only
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/justray-bin.git
    url_template: https://github.com/luynrs/justray/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    skip_upload: "{{ .IsSnapshot }}"
    provides: [justray]
    conflicts: [justray]
    package: |-
      install -Dm755 "./justray" "${pkgdir}/usr/bin/justray"
      install -Dm755 "./justrayd" "${pkgdir}/usr/bin/justrayd"
      ln -s justray "${pkgdir}/usr/bin/jray"

release:
  name_template: "{{ .Version }}"
  draft: false
  mode: replace
